<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="个人作品集展示网站，按作品顺序完整呈现图片内容。">
    <title>个人作品集</title>
    <link rel="preload" href="assets/images/001.png" as="image">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="返回顶部">Portfolio</a>
      <nav class="site-nav" aria-label="页面导航">
        <a href="#works">作品</a>
        <a href="#contact">联系</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">Selected Works</p>
          <h1 id="hero-title">个人作品集</h1>
          <p class="hero-text">按原始顺序完整展示每一张作品图片，保留画面比例与内容。</p>
        </div>
        <figure class="hero-image">
          <img src="assets/images/001.png" alt="作品 001 预览" width="1920" height="2713">
        </figure>
      </section>

      <section class="intro" aria-label="作品集概览">
        <p>32 件作品</p>
        <p>原图展示</p>
        <p>GitHub Pages</p>
      </section>

      <section id="works" class="works" aria-labelledby="works-title">
        <div class="section-heading">
          <p class="eyebrow">Gallery</p>
          <h2 id="works-title">作品展示</h2>
        </div>
        <div class="gallery" id="gallery"></div>
      </section>

      <section id="contact" class="contact" aria-labelledby="contact-title">
        <p class="eyebrow">Contact</p>
        <h2 id="contact-title">保持联系</h2>
        <p>这个页面适合作为作品集主页，也可以继续加上个人简介、项目说明或联系方式。</p>
      </section>
    </main>

    <dialog class="viewer" id="viewer" aria-label="作品大图查看">
      <button class="viewer-close" type="button" aria-label="关闭">×</button>
      <button class="viewer-nav viewer-prev" type="button" aria-label="上一张">‹</button>
      <img id="viewer-image" src="" alt="">
      <button class="viewer-nav viewer-next" type="button" aria-label="下一张">›</button>
      <p id="viewer-caption"></p>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
